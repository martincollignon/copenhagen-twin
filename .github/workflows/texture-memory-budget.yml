name: Texture memory budget

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texture-memory-budget:
    name: texture-memory-budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay camera route against atlas metadata
        run: node --test tests/texture-memory-budget.test.mjs
      - name: Check building picking, culling, and depth-only shadows
        run: node --test tests/building-batches.test.cjs tests/render-target-memory.test.cjs tests/lighting.test.cjs tests/boot.test.cjs
      - name: Check facade programs, rigid model batches, and city residency budget
        run: node --test tests/facade-program.test.cjs tests/rigid-meshes.test.cjs tests/tile-rings.test.mjs
      - name: Check streamed replacement, shared slicing, and photo draw budgets
        run: node --test tests/buildings-stream-lifecycle.test.cjs tests/yield-frame.test.cjs tests/photo-draw-budget.test.cjs tests/detail-overrides.test.mjs
      - name: Check static instance compaction
        run: node --test tests/static-instance-cache.test.mjs
      - name: Check collision geometry and actor interactions
        run: node --test tests/collision-shapes.test.mjs tests/static-colliders.test.mjs tests/city-collisions.test.mjs tests/collisions-city.test.mjs tests/controllers.test.cjs tests/traffic.test.cjs tests/traffic-performance.test.cjs tests/cph-boot.test.cjs tests/goboat-navigation.test.mjs tests/goboat-harbour.test.mjs
